[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ismypwdsafe"
version = "1.5.0rc1"
description = "The only password audit that doesn't spy on you."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
imps = "ismypwdsafe.cli:entry"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "jsonschema>=4.0",
]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pip-audit>=2.0.0",
    "cyclonedx-bom>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:ismypwdsafe.*",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"] # S101 è "assert" (ne abbiamo bisogno nei test)

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ismypwdsafe.core", "ismypwdsafe.patterns"]
strict = true
