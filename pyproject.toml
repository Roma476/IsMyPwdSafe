[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ismypwdsafe"
version = "1.2.0"
description = "The only password audit that doesn't spy on you."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
imps = "ismypwdsafe.main:main"
