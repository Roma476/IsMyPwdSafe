[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ismypwdsafe"
dynamic = ["version"]
description = "zxcvbn, but readable. Privacy-first password auditing for CLI and CI."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Roma476"}]
keywords = [
    "password",
    "security",
    "zxcvbn",
    "hibp",
    "haveibeenpwned",
    "ci",
    "dotenv",
    "secret-scanning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.28.0",
    # Keep the default install usable without Node.js.  `auto` can still prefer
    # the zxcvbn-ts bundle when Node 18+ is available.
    "zxcvbn>=4.4",
]

[project.urls]
Homepage = "https://github.com/Roma476/IsMyPwdSafe"
Documentation = "https://github.com/Roma476/IsMyPwdSafe#readme"
Repository = "https://github.com/Roma476/IsMyPwdSafe"
Issues = "https://github.com/Roma476/IsMyPwdSafe/issues"
Changelog = "https://github.com/Roma476/IsMyPwdSafe/blob/main/CHANGELOG.md"

[project.scripts]
imps = "ismypwdsafe.cli:entry"

[project.optional-dependencies]
python = ["zxcvbn>=4.4"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "jsonschema>=4.0",
    "zxcvbn>=4.4",
]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "pip-audit>=2.0.0",
    "cyclonedx-bom>=4.0.0",
]

[tool.setuptools]
# Only ship the generated bundle and its small metadata files. `node_modules`
# is a local build dependency and must never leak into a wheel or sdist.
include-package-data = false

[tool.setuptools.package-data]
ismypwdsafe = ["js/*.js", "js/*.mjs", "js/*.json", "py.typed"]

[tool.setuptools.packages.find]
include = ["ismypwdsafe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:ismypwdsafe.*",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "UP006", "UP007", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true


[tool.setuptools.dynamic]
version = {file = "version.txt"}

[[tool.mypy.overrides]]
module = ["zxcvbn"]
ignore_missing_imports = true
